# 官网自动部署（GitHub Pages）
#
# 只发布官网所需的静态文件（index.html / css / static / pwa-manifest.json），
# 不发布 app 源码、脚本与文档之外的内容，避免仓库根整包上线。
#
# 首次运行需要仓库已开启 Pages；下面的 configure-pages 带 enablement: true，
# 若仓库策略允许会自动创建 Pages 站点。若失败，请在仓库
# Settings → Pages → Source 选择 "GitHub Actions"，再手动重跑本工作流。
name: 部署官网

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'static/**'
      - 'pwa-manifest.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 组装发布目录：只挑官网资源，产物与源码目录隔离
      - name: 组装发布目录
        run: |
          mkdir -p _site
          cp -R index.html css static pwa-manifest.json _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
